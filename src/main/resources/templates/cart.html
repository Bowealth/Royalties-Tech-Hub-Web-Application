<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm px-4">

    <a class="navbar-brand" th:href="@{/}">
        👑 Royalties Hub
    </a>
</nav>
<div class="container py-5">

    <h2 class="mb-4 text-center fw-bold">
        🛒 Your Shopping Cart
    </h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Qty</th>
                        <th>Subtotal</th>
                        <th class="text-center">Action</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="item : ${cart}">

                        <td>
                            <img th:src="@{'/images/' + ${item.product.imageName}}"
                                 width="70"
                                 class="rounded shadow-sm">
                        </td>

                        <td class="fw-semibold"
                            th:text="${item.product.name}">
                        </td>

                        <td>
                            ₦<span th:text="${item.product.price}"></span>
                        </td>

                        <td>
                            <span class="badge bg-primary"
                                  th:text="${item.quantity}">
                            </span>
                        </td>

                        <td class="fw-bold text-success">
                            ₦<span th:text="${item.subtotal}"></span>
                        </td>

                        <td class="text-center">
                            <a th:href="@{/cart/remove/{id}(id=${item.product.id})}"
                               class="btn btn-sm btn-danger">
                                Remove
                            </a>
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

    <!-- TOTAL + CHECKOUT -->
    <div class="row mt-4">

        <div class="col-md-6 offset-md-6">

            <div class="card shadow-sm border-0">

                <div class="card-body text-end">

                    <h4 class="fw-bold">
                        Total:
                        <span class="text-success">
            ₦<span th:text="${total}"></span>
        </span>
                    </h4>

                    <a th:href="@{/}"
                       class="btn btn-outline-primary w-100 mt-3">
                        ← Continue Shopping
                    </a>

                    <a th:href="@{/cart/checkout}"
                       class="btn btn-success btn-lg w-100 mt-2">
                        Proceed to Checkout
                    </a>

                </div>

        </div>

    </div>

</div>

</body>
</html>
