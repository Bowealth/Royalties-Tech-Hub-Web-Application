<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Royalties Hub</title>

    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .navbar-brand{
            font-size:1.5rem;
            font-weight:bold;
        }

        .hero{
            background: linear-gradient(135deg,#0d6efd,#6610f2);
            color:white;
            padding:70px 20px;
            border-radius:20px;
            text-align:center;
            margin-bottom:40px;
        }

        .hero h1{
            font-size:3rem;
            font-weight:bold;
        }

        .hero p{
            font-size:1.2rem;
            opacity:.9;
        }

        .search-box{
            max-width:700px;
            margin:auto;
        }

        .card{
            border:none;
            border-radius:15px;
            overflow:hidden;
            transition:all .3s ease;
        }

        .card:hover{
            transform:translateY(-8px);
            box-shadow:0 12px 25px rgba(0,0,0,.15);
        }

        .card-img-top{
            height:220px;
            object-fit:cover;
        }

        .price{
            color:#198754;
            font-size:1.2rem;
            font-weight:bold;
        }

        .badge-sale{
            position:absolute;
            top:10px;
            right:10px;
        }
        .badge{
            font-size:0.8rem;
            padding:8px 12px;
        }

        .card-body{
            min-height:320px;
        }

        .text-warning{
            letter-spacing:2px;
        }

        .footer{
            margin-top:60px;
            background:#212529;
            color:white;
            padding:20px;
            text-align:center;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm px-4">

    <a class="navbar-brand" th:href="@{/}">
        👑 Royalties Hub
    </a>

    <div class="ms-auto d-flex align-items-center gap-2">

        <!-- CART -->
        <a th:href="@{/cart}"
           class="btn btn-warning fw-bold">
            🛒 Cart
        </a>

        <!-- LOGIN FORM -->
        <form th:action="@{/login}" method="post"
              class="d-flex gap-2">

            <input type="text"
                   name="username"
                   class="form-control form-control-sm"
                   placeholder="Email">

            <input type="password"
                   name="password"
                   class="form-control form-control-sm"
                   placeholder="Password">

            <button type="submit"
                    class="btn btn-success btn-sm">
                Login
            </button>

        </form>
        <a href="#"
           class="btn btn-primary btn-sm"
           data-bs-toggle="modal"
           data-bs-target="#registerModal">
            Register
        </a>

    </div>

</nav>

<div class="container mt-4">

    <!-- HERO SECTION -->

    <div class="hero">

        <h1>Welcome to Royalties Hub</h1>

        <p>
            Discover Quality Products at Amazing Prices
        </p>

    </div>

    <!-- SEARCH -->

    <form th:action="@{/search}"
          method="get"
          class="mb-5 search-box">

        <div class="input-group input-group-lg">

            <input type="text"
                   id="searchBox"
                   name="keyword"
                   class="form-control"
                   placeholder="Search products..."
                   th:value="${keyword}">

            <button type="submit"
                    class="btn btn-primary">
                🔍 Search
            </button>

        </div>

    </form>

    <!-- PRODUCTS -->

    <div class="row">

        <div class="col-lg-3 col-md-4 col-sm-6 mb-4"
             th:each="product : ${products}">

            <div class="card shadow-sm h-100">

                <span class="badge bg-danger badge-sale">
                    HOT
                </span>

                <img th:src="@{'/images/' + ${product.imageName}}"
                     class="card-img-top"
                     alt="Product Image">

                <div class="card-body d-flex flex-column">

                    <h5 class="fw-bold"
                        th:text="${product.name}">
                    </h5>

                    <!-- CATEGORY -->

                    <div class="mb-2">
        <span class="badge bg-primary"
              th:text="${product.category}">
        </span>
                    </div>

                    <!-- PRODUCT RATING -->

                    <!-- PRODUCT RATING -->

                    <div class="mb-2">

    <span class="text-warning">
        ⭐
    </span>

                        <small class="text-muted">
                            <span th:text="${#numbers.formatDecimal(product.rating,1,1)}"></span>/5
                        </small>

                    </div>

                    <!-- RATE PRODUCT -->

                    <form th:action="@{/product/rate}"
                          method="post"
                          class="mb-2">

                        <input type="hidden"
                               name="productId"
                               th:value="${product.id}">

                        <select name="stars"
                                class="form-select form-select-sm mb-2">

                            <option value="1">⭐ 1 Star</option>
                            <option value="2">⭐⭐ 2 Stars</option>
                            <option value="3">⭐⭐⭐ 3 Stars</option>
                            <option value="4">⭐⭐⭐⭐ 4 Stars</option>
                            <option value="5">⭐⭐⭐⭐⭐ 5 Stars</option>

                        </select>

                        <button type="submit"
                                class="btn btn-outline-primary btn-sm w-100">

                            Submit Rating

                        </button>

                    </form>

                    <!-- STOCK STATUS -->

                    <div class="mb-2">

        <span th:if="${product.stockQuantity > 10}"
              class="badge bg-success">
            In Stock
        </span>

                        <span th:if="${product.stockQuantity > 0 && product.stockQuantity <= 10}"
                              class="badge bg-warning text-dark">
            Low Stock
        </span>


                        <span th:if="${product.stockQuantity == 0}"
                              class="badge bg-danger">
            Out of Stock
        </span>

                    </div>

                    <!-- DESCRIPTION -->

                    <p class="text-muted small flex-grow-1"
                       th:text="${product.description}">
                    </p>

                    <!-- PRICE -->

                    <div class="mt-auto">

                        <p class="price">
                            ₦<span th:text="${product.price}"></span>
                        </p>

                        <!-- ADD TO CART -->

                        <a th:if="${product.stockQuantity > 0}"
                           th:href="@{/cart/add/{id}(id=${product.id})}"
                           class="btn btn-success w-100">
                            🛒 Add To Cart
                        </a>

                        <button th:if="${product.stockQuantity == 0}"
                                class="btn btn-secondary w-100"
                                disabled>
                            Out of Stock
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- FOOTER -->

<div class="footer">

    <h5>👑 Royalties Hub</h5>

    <p class="mb-0">
        Your One-Stop Online Store
    </p>

</div>

<div class="modal fade" id="registerModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content p-3">

            <div class="modal-header">
                <h5 class="modal-title">Create Account</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <form th:action="@{/register}" method="post" enctype="multipart/form-data">

                    <!-- FULL NAME -->
                    <input type="text"
                           name="fullName"
                           class="form-control mb-2"
                           placeholder="Full Name"
                           required>

                    <!-- EMAIL -->
                    <input type="email"
                           name="email"
                           class="form-control mb-2"
                           placeholder="Email"
                           required>

                    <!-- PASSWORD -->
                    <input type="password"
                           name="password"
                           class="form-control mb-2"
                           placeholder="Password"
                           required>

                    <!-- CONFIRM PASSWORD -->
                    <input type="password"
                           name="confirmPassword"
                           class="form-control mb-2"
                           placeholder="Confirm Password"
                           required>

                    <!-- PROFILE IMAGE -->
                    <input type="file"
                           name="image"
                           class="form-control mb-3"
                           accept="image/*">

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Register
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
<script>

    document.getElementById("searchBox")
        .addEventListener("input", function () {

            if(this.value.trim() === ""){
                window.location.href = "/";
            }

        });

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
