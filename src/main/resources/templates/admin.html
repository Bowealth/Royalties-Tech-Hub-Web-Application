<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Admin Dashboard</title>

    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background-color:#f8f9fa;
        }

        .dashboard-header{
            background:#212529;
            color:white;
            padding:20px;
            border-radius:15px;
            margin-bottom:30px;
        }

        .form-card,
        .table-card{
            background:white;
            border-radius:15px;
            padding:25px;
            box-shadow:0 4px 15px rgba(0,0,0,0.08);
        }

        .product-image{
            width:80px;
            height:80px;
            object-fit:cover;
            border-radius:10px;
        }

        .table th{
            background:#212529;
            color:white;
        }

        .btn{
            border-radius:8px;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <!-- HEADER -->

    <div class="dashboard-header d-flex justify-content-between align-items-center">

        <div>
            <h2 class="mb-0">🛠 Admin Dashboard</h2>
            <small>Manage Products & Inventory</small>
        </div>

        <form th:action="@{/logout}" method="post">
            <button type="submit"
                    class="btn btn-danger">
                Logout
            </button>
        </form>

    </div>

    <!-- PRODUCT FORM -->

    <div class="form-card mb-5">

        <h4 class="mb-4">
            ➕ Add New Product
        </h4>

        <form th:action="@{/admin/save}"
              method="post"
              enctype="multipart/form-data">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Product Name
                    </label>

                    <input type="text"
                           name="name"
                           class="form-control"
                           placeholder="Enter product name"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Price
                    </label>

                    <input type="number"
                           name="price"
                           class="form-control"
                           placeholder="Enter product price"
                           required>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Description
                </label>

                <textarea name="description"
                          rows="4"
                          class="form-control"
                          placeholder="Enter product description">
                </textarea>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Product Image
                </label>

                <input type="file"
                       name="imageFile"
                       class="form-control">

            </div>

            <button class="btn btn-primary px-4">
                Add Product
            </button>

        </form>

    </div>

    <!-- PRODUCT TABLE -->

    <div class="table-card">

        <h4 class="mb-4">
            📦 Product List
        </h4>

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th class="text-center">
                        Action
                    </th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="product : ${products}">

                    <td th:text="${product.id}"></td>

                    <td>

                        <img th:src="@{'/images/' + ${product.imageName}}"
                             class="product-image">

                    </td>

                    <td th:text="${product.name}"></td>

                    <td>
                        ₦<span th:text="${product.price}"></span>
                    </td>

                    <td class="text-center">

                        <a th:href="@{/admin/edit/{id}(id=${product.id})}"
                           class="btn btn-warning btn-sm">
                            ✏ Edit
                        </a>

                        <a th:href="@{/admin/delete/{id}(id=${product.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Delete this product?')">
                            🗑 Delete
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
