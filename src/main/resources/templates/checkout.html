<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Checkout - Royalties Hub</title>

    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .checkout-card{
            max-width:700px;
            margin:auto;
            margin-top:50px;
            border:none;
            border-radius:20px;
        }

        .price{
            color:#198754;
            font-size:1.4rem;
            font-weight:bold;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark px-4">

    <a class="navbar-brand"
       th:href="@{/}">
        👑 Royalties Hub
    </a>

</nav>

<div class="container">

    <div class="card shadow checkout-card">

        <div class="card-body p-4">

            <h2 class="text-center mb-4">
                Checkout
            </h2>

            <div class="alert alert-info">

                Total Amount:
                <span class="price">
                    ₦<span th:text="${total}"></span>
                </span>

            </div>

            <form th:action="@{/cart/checkout}"
                  th:object="${order}"
                  method="post">

                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input type="text"
                           th:field="*{customerName}"
                           class="form-control"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Email Address
                    </label>

                    <input type="email"
                           th:field="*{email}"
                           class="form-control"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Delivery Address
                    </label>

                    <textarea th:field="*{address}"
                              class="form-control"
                              rows="4"
                              required></textarea>

                </div>

                <button type="submit"
                        class="btn btn-success w-100">

                    Place Order

                </button>

            </form>

            <a th:href="@{/cart}"
               class="btn btn-outline-secondary w-100 mt-3">

                Back To Cart

            </a>

        </div>

    </div>

</div>

</body>

</html>
